<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>LuxMine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0f; margin: 0; overflow: hidden; }
        .logo-container {
            animation: logoIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes logoIn {
            0% { opacity: 0; transform: scale(0.6) translateY(30px); }
            60% { opacity: 1; transform: scale(1.05) translateY(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .pickaxe {
            animation: swing 1.8s ease-in-out infinite;
            transform-origin: 70% 30%;
        }
        @keyframes swing {
            0%, 100% { transform: rotate(-12deg); }
            50% { transform: rotate(18deg); }
        }
        .glow-ring {
            animation: pulseRing 2s ease-in-out infinite;
        }
        @keyframes pulseRing {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.15); opacity: 0.15; }
        }
        .fade-out {
            animation: fadeOut 0.6s ease forwards;
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: scale(1.05); }
        }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: #fbbf24;
            border-radius: 50%;
            animation: rise 2.5s ease-in infinite;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-120px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">
    <!-- Particles -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="particle" style="left:20%; bottom:30%; animation-delay:0s"></div>
        <div class="particle" style="left:35%; bottom:25%; animation-delay:0.4s"></div>
        <div class="particle" style="left:50%; bottom:35%; animation-delay:0.8s"></div>
        <div class="particle" style="left:65%; bottom:28%; animation-delay:1.2s"></div>
        <div class="particle" style="left:80%; bottom:32%; animation-delay:0.6s"></div>
    </div>

    <div id="splash" class="logo-container text-center relative z-10">
        <!-- Glow ring -->
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="glow-ring w-40 h-40 rounded-full border-2 border-amber-500/30"></div>
        </div>
        
        <!-- Logo -->
        <div class="relative">
            <div class="text-7xl mb-2 pickaxe">⛏️</div>
            <h1 class="text-4xl font-extrabold tracking-tight">
                <span class="bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-500 bg-clip-text text-transparent">Lux</span><span class="text-white">Mine</span>
            </h1>
            <p class="text-slate-400 text-sm mt-2 tracking-widest uppercase">Premium Mining Experience</p>
        </div>
        
        <!-- Loading bar -->
        <div class="mt-10 w-48 mx-auto">
            <div class="h-1 bg-slate-800 rounded-full overflow-hidden">
                <div id="bar" class="h-full bg-gradient-to-r from-amber-500 to-yellow-400 rounded-full" style="width:0%"></div>
            </div>
        </div>
    </div>

    <script>
        const bar = document.getElementById('bar');
        let w = 0;
        const interval = setInterval(() => {
            w += Math.random() * 18 + 8;
            if (w >= 100) {
                w = 100;
                clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('splash').classList.add('fade-out');
                    setTimeout(() => {
                        window.location.href = "{{ url_for('login') }}";
                    }, 550);
                }, 400);
            }
            bar.style.width = w + '%';
        }, 180);
    </script>
</body>
</html>
